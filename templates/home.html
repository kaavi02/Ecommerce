{% extends 'base.html' %}
{% block content %}

<!-- Search & Filter Controls -->
<div class="row my-4">
    <div class="col-md-12">
        <form method="GET" action="{% url 'home' %}" class="row g-2 align-items-center">
            <div class="col-md-5">
                <input type="text" name="q" class="form-control" placeholder="Search products..." value="{{ search_query }}">
            </div>
            <div class="col-md-3">
                <select name="category" class="form-select">
                    <option value="">All Categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <select name="sort" class="form-select">
                    <option value="">Sort By Price</option>
                    <option value="low_high" {% if sort_option == 'low_high' %}selected{% endif %}>Price: Low to High</option>
                    <option value="high_low" {% if sort_option == 'high_low' %}selected{% endif %}>Price: High to Low</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-outline-success w-100"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </form>
    </div>
</div>

<!-- Product Cards Grid -->
<div class="row row-cols-1 row-cols-md-4 g-3 mb-5">
    {% for product in products %}
    <div class="col">
        <div class="card card-custom h-100 shadow-sm position-relative">
            <span class="badge bg-success position-absolute top-0 start-0 m-2">{{ product.category }}</span>
            
            <!-- INCREASED IMAGE HEIGHT & COVER FIT -->
            <img src="{{ product.image_url }}" style="height: 280px; object-fit: cover; width: 100%;" class="card-img-top rounded-top" alt="{{ product.name }}">
            
            <div class="card-body d-flex flex-column text-center">
                <h5 class="fw-bold" style="color: #1b5e20;">{{ product.name }}</h5>
                <p class="text-muted small flex-grow-1">{{ product.description }}</p>
                <h4 class="fw-bold my-2" style="color: #2e7d32;">₹{{ product.price }}</h4>
                
                <div class="d-flex gap-2 mt-auto">
                    <a href="{% url 'add_to_cart' product.id %}" class="btn btn-red flex-grow-1">Add to Cart</a>
                    <a href="{% url 'add_to_wishlist' product.id %}" class="btn btn-outline-danger"><i class="fa-solid fa-heart"></i></a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <h4>No products found matching your search.</h4>
    </div>
    {% endfor %}
</div>

{% endblock %}
